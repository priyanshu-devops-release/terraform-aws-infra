variables:
  TF_VERSION: "1.14.3"
  TRIVY_VERSION: "0.76.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: "us-west-2"
  ENVIRONMENT:
    value: "dev"
    options:
      - "dev"
      - "staging"
      - "prod"
    description: "Deployment environment"

stages:
  - validate
  - plan
  - security
  - apply

# Cache providers only, never backend state/config
.terraform-cache:
  cache:
    key:
      files:
        - iac-standard/.terraform.lock.hcl
    paths:
      - iac-standard/.terraform/providers/
    policy: pull-push

.slack-notify:
  after_script:
    - |
      if [ -n "$SLACK_WEBHOOK_URL" ]; then
        ICON=":x:"
        if [ "$CI_JOB_STATUS" = "success" ]; then ICON=":white_check_mark:"; fi
        curl --fail --silent --show-error \
          -X POST \
          -H "Content-Type: application/json" \
          --data "{\"text\":\"${ICON} Terraform $CI_JOB_NAME ($ENVIRONMENT) $CI_JOB_STATUS on $CI_COMMIT_REF_NAME | pipeline_id: $CI_PIPELINE_ID\"}" \
          "$SLACK_WEBHOOK_URL" || true
      fi

# Only master may use the single OIDC role (trust policy: ref:master)
.master-only-rules:
  rules:
    - if: '$FIX_OIDC_SUB == "true"'   # TEMP: skip during fix pipeline
      when: never
    - if: '$CI_COMMIT_BRANCH == "master" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'

.aws-terraform:
  extends:
    - .terraform-cache
    - .slack-notify
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache aws-cli curl
    - 'test -n "$AWS_OIDC_ROLE" || (echo "ERROR: AWS_OIDC_ROLE is required"; exit 1)'
    - 'test -n "$GITLAB_OIDC_TOKEN" || (echo "ERROR: GITLAB_OIDC_TOKEN is unavailable; configure an id_token"; exit 1)'
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/.gitlab-oidc-token
    - export AWS_ROLE_ARN="$AWS_OIDC_ROLE"
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/.gitlab-oidc-token
    - export AWS_ROLE_SESSION_NAME="gitlab-${CI_PROJECT_ID}-${CI_JOB_ID}"
    - export AWS_DEFAULT_REGION="$AWS_REGION"
    # TEMP: print aud + sub claims only (never the token). Remove once AssumeRole works.
    - |
      P=$(echo "$GITLAB_OIDC_TOKEN" | cut -d. -f2 | tr '_-' '/+')
      while [ $(( ${#P} % 4 )) -ne 0 ]; do P="${P}="; done
      echo "$P" | base64 -d 2>/dev/null | grep -oE '"(sub|aud)":"[^"]*"' || true
    - aws sts get-caller-identity
    - export TF_VAR_public_key="$EC2_PUBLIC_KEY"
    - 'test -n "$TF_VAR_public_key" || (echo "ERROR: EC2_PUBLIC_KEY is required"; exit 1)'
    - 'if [ -z "$TF_VAR_app_db_password" ] && [ -n "$APP_DB_PASSWORD" ]; then export TF_VAR_app_db_password="$APP_DB_PASSWORD"; fi'
    - cd iac-standard
    - 'test -f "../environments/$ENVIRONMENT/$ENVIRONMENT-remotestate.conf" || (echo "ERROR: backend config not found for $ENVIRONMENT"; exit 1)'
    - terraform init -reconfigure "-backend-config=../environments/$ENVIRONMENT/$ENVIRONMENT-remotestate.conf"

# TEMP: one-time fix for "ID token issuance is disabled".
# Run: Build > Pipelines > Run pipeline on master with FIX_OIDC_SUB=true.
# Remove this job + GITLAB_ADMIN_TOKEN variable and revoke the PAT after success.
fix_oidc_sub_claim:
  stage: validate
  image: alpine:3.20
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "web" && $FIX_OIDC_SUB == "true"'
  script:
    - apk add --no-cache curl jq
    - 'test -n "$GITLAB_ADMIN_TOKEN" || (echo "ERROR: GITLAB_ADMIN_TOKEN not set"; exit 1)'
    # 1. Token scopes and status
    - echo "== Token info =="
    - 'curl -s --header "PRIVATE-TOKEN: $GITLAB_ADMIN_TOKEN" "$CI_API_V4_URL/personal_access_tokens/self" | jq "{name, scopes, active, revoked, expires_at}"'
    # 2. Token owner's role on this project (30=Developer, 40=Maintainer, 50=Owner)
    - echo "== Role on project =="
    - 'curl -s --header "PRIVATE-TOKEN: $GITLAB_ADMIN_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID" | jq ".permissions"'
    # 3. Attempt update and show GitLab's actual error body
    - echo "== Update attempt =="
    - |
      curl -s -w "\nHTTP %{http_code}\n" --request PUT \
        --header "PRIVATE-TOKEN: $GITLAB_ADMIN_TOKEN" \
        --header "Content-Type: application/json" \
        --data '{"ci_id_token_sub_claim_components":["project_id","ref_type","ref"]}' \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID" | jq -R -r '. as $l | (try (fromjson | if has("ci_id_token_sub_claim_components") then {ci_id_token_sub_claim_components} else . end) catch $l)'

terraform_validate:
  stage: validate
  extends:
    - .terraform-cache
    - .slack-notify
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  before_script:
    - apk add --no-cache curl
    - cd iac-standard
  script:
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: '$FIX_OIDC_SUB == "true"'   # TEMP: skip during fix pipeline
      when: never
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

terraform_plan:
  stage: plan
  extends:
    - .aws-terraform
    - .master-only-rules
  needs:
    - terraform_validate
  script:
    - 'test -f "../environments/$ENVIRONMENT/$ENVIRONMENT.tfvars" || (echo "ERROR: tfvars not found for $ENVIRONMENT"; exit 1)'
    - terraform plan "-var-file=../environments/$ENVIRONMENT/$ENVIRONMENT.tfvars" -out="$ENVIRONMENT.tfplan"
    - test -f "$ENVIRONMENT.tfplan"
  artifacts:
    expire_in: 1 day
    access: developer
    paths:
      - iac-standard/$ENVIRONMENT.tfplan
  environment:
    name: terraform-plan-$ENVIRONMENT
    action: prepare

terraform_security:
  stage: security
  image:
    name: aquasec/trivy:${TRIVY_VERSION}
    entrypoint: [""]
  needs:
    - job: terraform_plan
      optional: true
      artifacts: false
  script:
    - trivy config --format json --severity HIGH,CRITICAL --exit-code 1 --output trivy-results.json iac-standard
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-results.json
  rules:
    - if: '$FIX_OIDC_SUB == "true"'   # TEMP: skip during fix pipeline
      when: never
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

terraform_apply:
  stage: apply
  extends: .aws-terraform
  allow_failure: false
  resource_group: terraform-$ENVIRONMENT
  needs:
    - terraform_plan
    - terraform_security
  script:
    - 'test -f "$ENVIRONMENT.tfplan" || (echo "ERROR: Terraform plan download failed"; exit 1)'
    - echo "Applying saved Terraform plan for $ENVIRONMENT"
    - terraform apply -input=false "$ENVIRONMENT.tfplan"
  rules:
    - if: '$FIX_OIDC_SUB == "true"'   # TEMP: skip during fix pipeline
      when: never
    - if: '$CI_COMMIT_BRANCH == "master" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
      when: manual
  environment:
    name: terraform-apply-$ENVIRONMENT
    action: start