name: Terraform IAC App Stack

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      apply:
        description: 'Terraform Deploy'
        required: true
        type: boolean
        default: false
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
        - dev
        - staging
        - prod
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: iac-standard

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
    - uses: actions/checkout@v4

    - name: Cache Terraform plugins
      uses: actions/cache@v4
      with:
        path: .terraform
        key: ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-${{ hashFiles('dev-standard/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.3

    - name: Terraform fmt check
      run: terraform fmt -check

    - name: Terraform Init (no backend)
      run: |
        # Initialize without remote backend to speed up validation and avoid backend network calls
        terraform init -backend=false -upgrade

    - name: Terraform Validate
      run: terraform validate

    - name: Slack Notification
      if: always()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} Terraform `${{ github.job }}` - ${{ job.status }}"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: dev-standard

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
    - uses: actions/checkout@v4

    - name: Cache Terraform plugins
      uses: actions/cache@v4
      with:
        path: .terraform
        key: ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-${{ hashFiles('dev-standard/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.3

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Terraform Init (for state backup)
      run: |
        set -e
        terraform init -upgrade -backend-config=../environments/${{ env.ENVIRONMENT }}/${{ env.ENVIRONMENT }}-remotestate.conf || true
        TIMESTAMP=$(date +%s)
        terraform state pull > ${ENVIRONMENT}-state-${TIMESTAMP}.json || echo "no state to pull"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ env.ENVIRONMENT }}-state-backup
        path: dev-standard/${{ env.ENVIRONMENT }}-state-*.json
        retention-days: 10

    - name: Terraform Init & Plan
      run: |
        terraform init -upgrade -backend-config=../environments/${{ env.ENVIRONMENT }}/${{ env.ENVIRONMENT }}-remotestate.conf
        terraform plan \
          -var-file=../environments/${{ env.ENVIRONMENT }}/${{ env.ENVIRONMENT }}.tfvars \
          -out=${{ env.ENVIRONMENT }}-tfplan \
          -input=false

    - name: Export human-readable plan
      run: |
        terraform show -no-color ${ENVIRONMENT}-tfplan > ${ENVIRONMENT}-tfplan.txt

    - name: Debug before upload
      run: |
        echo "DEBUG: working dir: $(pwd)"
        echo "DEBUG: files:" 
        ls -la
        echo "DEBUG: plan files match for ${ENVIRONMENT}:"
        ls -la ${ENVIRONMENT}-tfplan* || true

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ENVIRONMENT }}-tfplan-package
        path: |
          dev-standard/${{ env.ENVIRONMENT }}-tfplan
          dev-standard/${{ env.ENVIRONMENT }}-tfplan.txt
        retention-days: 10
        if-no-files-found: error

    - name: Plan summary (visible in logs)
      run: |
        echo "----- Plan summary (${ENVIRONMENT}) (first 200 lines) -----"
        if [ -f "${ENVIRONMENT}-tfplan.txt" ]; then
          head -n 200 "${ENVIRONMENT}-tfplan.txt" || true
        else
          echo "Plan text file not found: ${ENVIRONMENT}-tfplan.txt"
        fi

    - name: Slack Notification
      if: always()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "${{ job.status == 'success' && '✅' || '❌' }} Terraform `${{ github.job }}` ${{ job.status }} on `${{ github.ref_name }}`"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs:
    - validate
    - plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true'
    environment: terraform-apply-${{ github.event.inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: dev-standard

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: ${{ env.ENVIRONMENT }}-tfplan-package
        path: .

    - name: Show plan files and summary
      run: |
        echo "Downloaded files:"
        ls -la
        echo "\n----- Plan summary (first 400 lines) -----\n"
        head -n 400 ${ENVIRONMENT}-tfplan.txt || true

    - name: Create pre-apply state backup
      run: |
        set -e
        terraform init -upgrade -backend-config=../environments/${{ env.ENVIRONMENT }}/${{ env.ENVIRONMENT }}-remotestate.conf || true
        TIMESTAMP=$(date +%s)
        terraform state pull > ${ENVIRONMENT}-state-${TIMESTAMP}.json || echo "no state to pull"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ env.ENVIRONMENT }}-state-backup
        path: dev-standard/${{ env.ENVIRONMENT }}-state-*.json
        retention-days: 10
        if-no-files-found: warn

    - name: Terraform Init & Apply
      run: |
        terraform init -upgrade -backend-config=../environments/${{ env.ENVIRONMENT }}/${{ env.ENVIRONMENT }}-remotestate.conf
        terraform apply -input=false ${ENVIRONMENT}-tfplan

    - name: Slack Notification
      if: always()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "${{ job.status == 'success' && '✅' || '❌' }} Terraform `${{ github.job }}` - ${{ job.status }}\n*Job:* `${{ github.job }}`\n*Branch:* `${{ github.ref_name }}`\n*Actor:* `${{ github.actor }}`\n*Repo:* `${{ github.repository }}`\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}