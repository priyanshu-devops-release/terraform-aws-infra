name: Terraform IAC App Stack

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      apply:
        description: 'Terraform Deploy'
        required: true
        type: boolean
        default: false
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
        - dev
        - staging
        - prod
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dev-standard

    steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.3
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
        aws-region: ${{ vars.AWS_REGION }}
    - name: Terraform Init
      run: |
        terraform init -upgrade -backend-config=../environments/dev/dev-remotestate.conf
#        terraform workspace select dev || terraform workspace new dev

    - name: Terraform Validate
      run: terraform validate

    - name: Slack Notification
      if: always()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "Terraform Validate - ${{ job.status }}",
            "attachments": [
              {
                "color": "${{ job.status == 'success' && '#2eb886' || '#e01e5a' }}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "${{ job.status == 'success' && '🟢 SUCCESS' || '🔴 FAILED' }} - Terraform Validate",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Repository:*\n${{ github.repository }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Branch:*\n${{ github.ref_name }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Environment:*\n${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Triggered By:*\n${{ github.actor }}"
                      }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "*Workflow:* ${{ github.workflow }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Run #:* #${{ github.run_number }}"
                      }
                    ]
                  },
                  {
                    "type": "divider"
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "View Workflow"
                        },
                        "style": "primary",
                        "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      },
                      {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "View Commit"
                        },
                        "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: dev-standard

    steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.3

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Terraform Init & Plan
      run: |
        terraform init -upgrade -backend-config=../environments/dev/dev-remotestate.conf
        terraform plan \
          -var-file=../environments/dev/dev.tfvars \
          -out=dev-tfplan

    - uses: actions/upload-artifact@v4
      with:
        name: dev-tfplan
        path: dev-standard/dev-tfplan

    - name: Slack Notification
      if: always()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "${{ job.status == 'success' && '✅' || '❌' }} Terraform `${{ github.job }}` ${{ job.status }} on `${{ github.ref_name }}`",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "${{ job.status == 'success' && '✅ Terraform Succeeded' || '❌ Terraform Failed' }}",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Job:*\n`${{ github.job }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Status:*\n`${{ job.status }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:*\n`${{ github.ref_name }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Triggered By:*\n`${{ github.actor }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Repo:*\n`${{ github.repository }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Run:*\n`#${{ github.run_number }}`"
                  }
                ]
              },
              {
                "type": "divider"
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "🔍 View Run",
                      "emoji": true
                    },
                    "style": "primary",
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "📦 View Commit",
                      "emoji": true
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "🗂 View Repo",
                      "emoji": true
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}"
                  }
                ]
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Workflow: *${{ github.workflow }}* | SHA: `${{ github.sha }}`"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs:
    - terraform-validate
    - terraform-plan
    if: github.event.inputs.apply == 'true'
    environment: terraform-apply-dev

    defaults:
      run:
        working-directory: dev-standard

    steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.3

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
        aws-region: ${{ vars.AWS_REGION }}

    - uses: actions/download-artifact@v4
      with:
        name: dev-tfplan
        path: dev-standard

    - name: Terraform Init & Apply
      run: |
        terraform init -upgrade -backend-config=../environments/dev/dev-remotestate.conf
        terraform apply dev-tfplan

    - name: Slack Notification
      if: always()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "Terraform Apply - ${{ job.status }}",
            "attachments": [
              {
                "color": "${{ job.status == 'success' && '#2eb886' || '#e01e5a' }}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "${{ job.status == 'success' && '🟢 SUCCESS' || '🔴 FAILED' }} - Terraform Apply",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Repository:*\n${{ github.repository }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Branch:*\n${{ github.ref_name }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Environment:*\n${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Triggered By:*\n${{ github.actor }}"
                      }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "*Workflow:* ${{ github.workflow }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Run #:* #${{ github.run_number }}"
                      }
                    ]
                  },
                  {
                    "type": "divider"
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "View Workflow"
                        },
                        "style": "primary",
                        "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      },
                      {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "View Commit"
                        },
                        "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}