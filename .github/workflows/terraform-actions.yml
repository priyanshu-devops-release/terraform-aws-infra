name: Terraform IAC App Stack

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select deployment environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      action:
        description: 'Choose action: plan or apply'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      plan_run_id:
        description: 'Run ID of the approved plan to apply (required when action is apply)'
        required: false
        type: string
        default: ''

concurrency:
  group: terraform-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: iac-standard

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
    - uses: actions/checkout@v4

    - name: Cache Terraform plugins
      uses: actions/cache@v4
      with:
        path: .terraform
        key: ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-${{ hashFiles('iac-standard/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.3

    - name: Terraform fmt check
      run: terraform fmt -check

    - name: Terraform Init (no backend)
      run: terraform init -backend=false -upgrade

    - name: Terraform Validate
      run: terraform validate

    - name: Slack Notification
      if: always()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} Terraform validate - ${{ job.status }}"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan'

    defaults:
      run:
        working-directory: iac-standard

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      ACTION: ${{ github.event.inputs.action || 'plan' }}
      TF_VAR_public_key: ${{ secrets.EC2_PUBLIC_KEY }}
      PLAN_FILE: ${{ github.event.inputs.environment || 'dev' }}.tfplan
      S3_PLAN_KEY: terraform-plans/${{ github.event.inputs.environment || 'dev' }}/${{ github.run_id }}/terraform.tfplan

    steps:
    - uses: actions/checkout@v4

    - name: Cache Terraform plugins
      uses: actions/cache@v4
      with:
        path: .terraform
        key: ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-${{ hashFiles('iac-standard/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.3

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Terraform Init & Plan
      run: |
        set -e
        terraform init -upgrade -backend-config=../environments/${{ env.ENVIRONMENT }}/${{ env.ENVIRONMENT }}-remotestate.conf
        terraform plan -var-file=../environments/${{ env.ENVIRONMENT }}/${{ env.ENVIRONMENT }}.tfvars -out=${PLAN_FILE} -input=false

    - name: Verify plan file
      run: |
        test -f "${PLAN_FILE}" && echo "Plan exists" || (echo "ERROR: plan file missing"; exit 1)

    - name: Trivy Terraform security scan
      uses: aquasecurity/trivy-action@0.33.1
      with:
        scan-type: config
        scan-ref: iac-standard
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        exit-code: '1'

    - name: Upload Trivy SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif

    - name: Upload tfplan to S3
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan'
      run: |
        aws s3 cp "${PLAN_FILE}" s3://${{ secrets.TF_PLANS_BUCKET }}/${{ env.S3_PLAN_KEY }} --sse aws:kms --no-progress
        echo "✅ Plan uploaded to s3://${{ secrets.TF_PLANS_BUCKET }}/${{ env.S3_PLAN_KEY }}"

    - name: Slack Notification
      if: always()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "${{ job.status == 'success' && '✅' || '❌' }} Terraform plan ${{ job.status }} on `${{ github.ref_name }}` | run_id: `${{ github.run_id }}`",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Terraform plan* ${{ job.status }} on `${{ github.ref_name }}`\n*Environment:* `${{ env.ENVIRONMENT }}`\n*Run ID:* `${{ github.run_id }}`"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "Open Run"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "Open Repo"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs:
    - validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    environment: terraform-apply-${{ github.event.inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: iac-standard

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      ACTION: ${{ github.event.inputs.action || 'apply' }}
      TF_VAR_public_key: ${{ secrets.EC2_PUBLIC_KEY }}
      PLAN_FILE: ${{ github.event.inputs.environment || 'dev' }}.tfplan
      PLAN_RUN_ID: ${{ github.event.inputs.plan_run_id || '' }}
      S3_PLAN_KEY: terraform-plans/${{ github.event.inputs.environment || 'dev' }}/${{ github.event.inputs.plan_run_id }}/terraform.tfplan

    steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.3

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Download tfplan from S3
      run: |
        if [ -z "${PLAN_RUN_ID}" ]; then
          echo "ERROR: plan_run_id is required when applying"
          exit 1
        fi
        aws s3 cp s3://${{ secrets.TF_PLANS_BUCKET }}/${{ env.S3_PLAN_KEY }} "${PLAN_FILE}" --no-progress
        echo "✅ Plan downloaded from s3://${{ secrets.TF_PLANS_BUCKET }}/${{ env.S3_PLAN_KEY }}"

    - name: Verify plan exists
      run: |
        if [ ! -f "${PLAN_FILE}" ]; then
          echo "ERROR: Terraform plan not found!"
          exit 1
        fi

    - name: Terraform Init & Apply
      run: |
        set -e
        terraform init -upgrade -backend-config=../environments/${{ env.ENVIRONMENT }}/${{ env.ENVIRONMENT }}-remotestate.conf
        echo "Applying stored Terraform plan for $ENVIRONMENT"
        terraform apply -input=false "${PLAN_FILE}"

    - name: Slack Notification
      if: always()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "${{ job.status == 'success' && '✅' || '❌' }} Terraform apply ${{ job.status }} on `${{ github.ref_name }}` | plan_run_id: `${{ github.event.inputs.plan_run_id }}`",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Terraform apply* ${{ job.status }} on `${{ github.ref_name }}`\n*Environment:* `${{ env.ENVIRONMENT }}`\n*Plan run ID:* `${{ github.event.inputs.plan_run_id }}`"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "Open Apply Run"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "Open Plan Run"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.inputs.plan_run_id }}"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK